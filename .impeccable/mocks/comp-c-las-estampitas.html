<meta charset="utf-8">
<title>El Santuario — Comp C — Las Estampitas</title>

<link rel="stylesheet" href="_shared.css">
<style>
  .void{position:absolute;inset:0;background:
    radial-gradient(58% 52% at 44% 47%, rgba(255,168,70,.11), transparent 66%),
    radial-gradient(40% 40% at 82% 74%, rgba(176,18,24,.10), transparent 70%),
    linear-gradient(180deg,#0A0806,#070605)}
  .card{position:absolute;border-radius:2px;overflow:hidden;
    background:linear-gradient(158deg,#2C2A24,#1A1915);
    border:1px solid rgba(217,213,200,.13);
    box-shadow:0 14px 34px rgba(0,0,0,.8),inset 0 1px 0 rgba(217,213,200,.10)}
  .card .img{height:56%;background:
      radial-gradient(70% 90% at 50% 74%, rgba(176,18,24,.22), transparent 70%),
      linear-gradient(172deg,#3A362C,#211F1A);
    border-bottom:1px solid rgba(217,213,200,.10);position:relative}
  .card .img:after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(46deg,rgba(0,0,0,.22) 0 2px,transparent 2px 6px)}
  .card .cap{padding:7px 8px 0;text-align:center}
  .card .cap .t{font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
    color:rgba(217,213,200,.62);line-height:1.5}
  .card .cap .d{font-size:6.5px;letter-spacing:.18em;color:rgba(217,213,200,.34);margin-top:3px}
  .card.gr{background:linear-gradient(158deg,#7E6520,#4E3D11);border-color:rgba(228,196,106,.30)}
  .card.gr .img{background:radial-gradient(70% 90% at 50% 74%, rgba(255,201,120,.30), transparent 70%),
      linear-gradient(172deg,#8A6E24,#5A4614);border-bottom-color:rgba(228,196,106,.28)}
  .card.gr .cap .t{color:#E9CE7E}.card.gr .cap .d{color:rgba(233,206,126,.55)}
  .card.empty .img{background:linear-gradient(172deg,#221F1A,#141210)}
  .card.empty .img:before{content:"SIN IMAGEN";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font-size:6px;letter-spacing:.3em;
    color:rgba(217,213,200,.16)}
  .ribbon2{position:absolute;top:-40px;width:11px;z-index:8;
    background:linear-gradient(180deg,#8E1017,#4A080C 75%,rgba(74,8,12,0));
    filter:blur(1.2px);opacity:.6}
  .hint{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:95;
    font-family:'Alegreya',serif;font-style:italic;font-size:15px;color:rgba(232,220,192,.34)}
</style>
<div class="void"></div>
