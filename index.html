<!--
THESIS: A shrine you move through, not a timeline you scroll. Thirteen votive objects in the
  dark, entered in whatever order you choose, lit only by a light you carry. It refuses the
  full-bleed hero-and-scroll tribute and its museum-white opposite alike.
OWN-WORLD: Warm-black volume, Gauchito red as the committed carrier, candle-warm point light
  travelling with the visitor. Tin for te pido, brass for gracias, and two engraved plaques that
  carry no image at all. Chivo engraved capitals; Alegreya italic for the room's own voice.
  Celeste is withheld from the entire palette until a release is earned.
STORY: The visitor understands that the asking went on far longer than the thanks, because they
  can see the proportion before they read a word. They believe it because they had to move to
  find it. They leave having lit a path nobody else will light in the same order.
FIRST VIEWPORT: No hero, no nav, no scroll affordance. Panels suspended at depth, the nearest
  legible and the rest falling away into fog. One flame under the cursor. Moving IS the action.
FORM: Las Estampitas (composition C), candidate 3 of the grounded list. Seed key 714794b2.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
  verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
