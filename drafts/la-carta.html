<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Santuario — La Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;700;900&family=Alegreya:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0A0806; --red:#B01218; --red-deep:#5E0A0E;
  --flame:#FFB347; --flame-hot:#FFD9A0;
  --paper:#4A4237; --paper-lit:#E4D8BC; --rule:#6E6047;
  --ink:#141210; --wax:#E8DCC0; --brass-hi:#E4C46A; --celeste:#75AADB;
  --pool:300px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--night);overflow:hidden}
body{font-family:'Chivo',system-ui,sans-serif;color:var(--wax);cursor:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1400px}
#pages{display:flex;gap:34px;transform:rotateX(6deg);transition:transform .6s cubic-bezier(.22,1,.36,1)}

.page{position:relative;width:330px;height:466px;flex:none;padding:38px 26px 26px;
  box-shadow:0 30px 70px rgba(0,0,0,.85)}
/* the paper takes the light; the ink never does, so a lit word stays lit */
.sheet{position:absolute;inset:0;border-radius:2px;overflow:hidden;
  background:
    linear-gradient(178deg, color-mix(in srgb,var(--paper) 92%,#000) 0%, var(--paper) 40%, color-mix(in srgb,var(--paper) 88%,#000) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  filter:brightness(.40) saturate(.7);transition:filter .5s ease}
.sheet:before{ /* torn top edge */
  content:"";position:absolute;left:0;right:0;top:0;height:9px;
  background:repeating-linear-gradient(92deg,var(--night) 0 3px,transparent 3px 7px);opacity:.55}
.sheet:after{ /* notepad rules */
  content:"";position:absolute;left:22px;right:22px;top:52px;bottom:26px;
  background:repeating-linear-gradient(180deg,transparent 0 21px,rgba(110,96,71,.55) 21px 22px)}
.page .hd{position:absolute;z-index:3;top:17px;left:26px;right:26px;display:flex;justify-content:space-between;
  font-size:7px;letter-spacing:.24em;text-transform:uppercase;color:rgba(20,18,16,.42);font-weight:700}
.body{position:relative;z-index:2;padding-top:14px}

/* every line sits on a rule; jitter makes it sit like a hand, not a text box */
.ln{height:22px;display:flex;align-items:flex-end;gap:.34em;padding-bottom:3px;white-space:nowrap}
.w{font-size:11.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
  color:rgba(20,18,16,.30);transition:color .45s ease,text-shadow .45s ease;position:relative}
.w.lit{color:#0E0C0A;text-shadow:0 0 1px rgba(232,220,192,.55),0 0 14px rgba(255,179,71,.42)}
.page.dim .w.lit{color:#2A251C;text-shadow:0 0 2px rgba(232,220,192,.30),0 0 10px rgba(255,179,71,.22)}
.w.struck{text-decoration:line-through;text-decoration-thickness:1.5px;
  text-decoration-color:rgba(20,18,16,.55);opacity:.62}
/* an unsourced line: ruled, empty, and honest about it */
.blank{flex:1;height:1px;background:transparent}
.ln.pending{opacity:.9}

/* the light the visitor carries */
#pool{position:fixed;width:var(--pool);height:var(--pool);border-radius:50%;pointer-events:none;z-index:40;
  transform:translate(-50%,-50%);mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,201,120,.30) 0%,rgba(255,168,70,.15) 30%,rgba(180,90,20,.05) 52%,transparent 72%)}
#flame{position:fixed;z-index:41;pointer-events:none;transform:translate(-50%,-50%);
  width:12px;height:22px;border-radius:50% 50% 44% 44%;
  background:radial-gradient(circle at 50% 70%,#FFF6DC,#FFC163 55%,rgba(255,140,40,0) 80%);
  box-shadow:0 0 34px 12px rgba(255,168,70,.34)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(120% 100% at 50% 45%,transparent 12%,rgba(0,0,0,.62) 58%,rgba(0,0,0,.96) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:61;opacity:.5;mix-blend-mode:overlay}

/* chrome */
.mark{position:fixed;top:34px;left:40px;z-index:70;font-size:10px;letter-spacing:.42em;
  text-transform:uppercase;color:rgba(232,220,192,.5);font-weight:700}
.mark b{color:var(--red)}
.state{position:fixed;top:34px;right:40px;z-index:70;font-size:9px;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(232,220,192,.34);text-align:right;line-height:2}
.state u{text-decoration:none;color:var(--brass-hi)}
.cap{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:70;text-align:center;
  font-family:'Alegreya',serif;font-style:italic;font-size:16px;color:rgba(232,220,192,.44);
  transition:opacity .6s ease}
.meter{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:70;
  font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(232,220,192,.32)}
.meter i{font-style:normal;color:var(--brass-hi)}
.src{position:fixed;left:40px;bottom:34px;z-index:70;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(232,220,192,.26);max-width:430px;line-height:2}
.src em{color:var(--red);font-style:normal}

@media (prefers-reduced-motion:reduce){
  /* the same letter, held still: everything is already lit, nothing follows the cursor */
  #pool,#flame{display:none}
  .w{color:var(--ink)!important}
  .sheet{filter:brightness(1.06) saturate(1)!important}
  #pages{transform:none}
  body{cursor:auto}
}
@media (max-width:900px){
  /* the room becomes a document: nothing floats over the letter */
  html,body{height:auto;overflow:visible}
  body{cursor:auto}
  #stage{position:static;display:block;padding:58px 0 0;perspective:none}
  #pages{flex-direction:column;gap:20px;transform:none;align-items:center}
  .page{width:min(88vw,330px)}
  #flame,#vig{display:none}
  #pool{width:240px;height:240px}
  .sheet{filter:brightness(1.02) saturate(.95)!important}
  .mark{position:fixed;top:0;left:0;right:0;padding:14px 18px;font-size:9px;
    background:linear-gradient(180deg,rgba(10,8,6,.96),rgba(10,8,6,.82) 70%,transparent);
    backdrop-filter:blur(3px)}
  .state,.cap,.meter,.src{position:static;transform:none;left:auto;right:auto;bottom:auto;top:auto;
    text-align:center;margin:0 auto;max-width:88vw;padding:0 4px}
  .state{order:1;margin-top:26px;line-height:2.2}
  .cap{margin-top:22px}
  .meter{margin-top:12px}
  .src{margin:20px auto 44px;text-align:center}
}
</style>
</head>
<body>
<!--
THESIS: A goodbye read the way a shrine is read — a few words at a time, by a light you carry.
  It refuses the letter-as-hero-image and the letter-as-scrolling-blockquote alike.
OWN-WORLD: Warm-black ground, Gauchito red as the committed carrier, candle-warm key. Notepad
  paper dim until lit. Chivo engraved capitals for his words; Alegreya italic for the room's own
  voice. Celeste withheld from the entire palette until a release is earned.
STORY: The visitor understands that this ending was written two days after the final and held for
  six weeks. They believe it because they had to work to read it. They leave having lit a path
  through it that nobody else will light in the same order.
FIRST VIEWPORT: Three notepad pages side by side, near-black, centred, tilted back six degrees.
  No navigation. The only bright thing is the flame under the cursor. There is no primary action;
  moving IS the action.
FORM: Las Estampitas (composition C), candidate 3 of the grounded list. Seed key 714794b2.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
  verdict, DESIGN.md, and every shipping raster carrying its provenance.

DRAFT STATUS — the letter's full text has NOT been obtained. Only fragments verified against
published reporting are set as words. Every other line renders as an empty rule. Nothing on this
page approximates, paraphrases or reconstructs Messi's words. See LETTER[] below.
-->
<div id="stage">
  <div id="pages"></div>
</div>
<div id="pool"></div>
<div id="flame"></div>
<div id="vig"></div>
<canvas id="grain"></canvas>

<div class="mark">EL SANTUARIO <b>·</b> LA CARTA</div>
<div class="state">TE PIDO · GRACIAS<br><u>· EL TERCER ESTADO ·</u><br>SIN NOMBRE TODAVÍA</div>
<div class="cap" id="cap">acercá la vela</div>
<div class="meter"><i id="litN">0</i> DE <span id="totN">0</span> PALABRAS ENCENDIDAS</div>
<div class="src">
  <em>BORRADOR</em> — CARTA ESCRITA 21·VII·2026, PUBLICADA 31·VIII·2026.<br>
  SÓLO SE MUESTRAN FRAGMENTOS VERIFICADOS. LAS LÍNEAS VACÍAS ESPERAN EL TEXTO ORIGINAL.
</div>

<script>
/* ---------------------------------------------------------------------------
   LETTER[] — the transcript.
   RULE: a string is text VERIFIED against published reporting and safe to set.
         null is a line we do not have. It renders as an empty rule and stays empty.
         Do NOT fill a null with a paraphrase, a translation, or a guess.
   Replace this array wholesale once the published pages are in hand.
   struck: indices within the line that were crossed out in the original. The
         mechanic is built and unused — no crossing-out is applied until the
         published pages confirm which words were struck.
--------------------------------------------------------------------------- */
const LETTER = [
  { page:0, lines:[
    null, null,
    "DESPUÉS DEL TIEMPO QUE PASÓ",           // verified fragment (translated reporting)
    "DESDE LA FINAL, Y DE HABERLO",
    "PENSADO MUCHÍSIMO, QUIERO",
    "DECIRLES A TODOS QUE ME",
    "RETIRO DE LA SELECCIÓN.",
    null, null, null, null, null, null, null, null
  ]},
  { page:1, lines:[
    null, null, null, null, null,
    "LO DI TODO, NO ME QUEDA",               // verified fragment
    "NADA MÁS PARA DAR.",
    null, null, null, null, null, null, null, null
  ]},
  { page:2, lines:[
    null, null, null, null, null, null, null, null, null, null,
    null, null, null,
    null, null
  ]}
];

const PAGE_META = [["I","21·VII·2026"],["II","—"],["III","—"]];
const pagesEl = document.getElementById('pages');
let seed = 20260721; const rnd = () => (seed = (seed*1664525+1013904223)%4294967296)/4294967296;

LETTER.forEach((pg,pi)=>{
  const p = document.createElement('div'); p.className='page';
  p.innerHTML = `<div class="sheet"></div>`
    + `<div class="hd"><span>${PAGE_META[pi][0]}</span><span>${PAGE_META[pi][1]}</span></div>`;
  const b = document.createElement('div'); b.className='body';
  pg.lines.forEach(line=>{
    const ln = document.createElement('div'); ln.className='ln';
    if(line===null){ ln.classList.add('pending'); ln.innerHTML='<span class="blank"></span>'; }
    else{
      line.split(/\s+/).forEach(word=>{
        const w=document.createElement('span'); w.className='w'; w.textContent=word;
        w.style.transform=`translateY(${(rnd()-.5)*1.8}px) rotate(${(rnd()-.5)*1.1}deg)`;
        ln.appendChild(w);
      });
    }
    b.appendChild(ln);
  });
  p.appendChild(b); pagesEl.appendChild(p);
});

/* --- the light the visitor carries --- */
const pool=document.getElementById('pool'), flame=document.getElementById('flame'),
      cap=document.getElementById('cap'), litN=document.getElementById('litN');
const words=[...document.querySelectorAll('.w')];
document.getElementById('totN').textContent=words.length;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const coarse=matchMedia('(max-width:900px)').matches;
let lit=0, moved=false, R=150;

function seat(){ return words.map(w=>{const r=w.getBoundingClientRect();
  return {el:w,x:r.left+r.width/2,y:r.top+r.height/2};}); }
let boxes=seat();
addEventListener('resize',()=>{boxes=seat();});

function light(mx,my){
  pool.style.left=mx+'px'; pool.style.top=my+'px';
  flame.style.left=mx+'px'; flame.style.top=my+'px';
  // brighten whichever page the light is over
  document.querySelectorAll('.page').forEach(p=>{
    const r=p.getBoundingClientRect();
    const d=Math.hypot(mx-(r.left+r.width/2), my-(r.top+r.height/2));
    const k=Math.max(0,1-d/560);
    p.querySelector('.sheet').style.filter=
      `brightness(${(0.40+k*0.98).toFixed(2)}) saturate(${(0.7+k*0.35).toFixed(2)})`;
    p.classList.toggle('dim', k<0.32);
  });
  // a word the light touches stays lit, permanently
  for(const b of boxes){
    if(b.el.classList.contains('lit')) continue;
    if(Math.hypot(mx-b.x,my-b.y)<R){ b.el.classList.add('lit'); lit++; }
  }
  litN.textContent=lit;
  if(!moved && lit>0){ moved=true; cap.style.opacity='0'; }
}

if(reduce || coarse){
  words.forEach(w=>w.classList.add('lit')); lit=words.length; litN.textContent=lit;
  cap.textContent = reduce ? 'la misma carta, quieta' : 'deslizá para leer';
  if(coarse && !reduce){
    // Touch: the pool follows the finger as warmth only. It must never gate legibility --
    // a reader without a hover cursor gets the whole letter, not a worse version of it.
    const glow=(x,y)=>{pool.style.left=x+'px';pool.style.top=y+'px';};
    addEventListener('touchmove',e=>{const t=e.touches[0];glow(t.clientX,t.clientY);},{passive:true});
    addEventListener('touchstart',e=>{const t=e.touches[0];glow(t.clientX,t.clientY);},{passive:true});
  }
}else{
  // The light follows the pointer DIRECTLY -- a carried light should never lag its
  // hand, and it must not depend on rAF, which some embedded viewers throttle to zero.
  light(innerWidth/2, innerHeight/2);
  addEventListener('pointermove',e=>light(e.clientX,e.clientY),{passive:true});

  // ONE CLOCK -- the only free motion in the room is the flame's flicker, and it runs
  // off a single shared tempo. If rAF is throttled the room still works; it just holds still.
  const CLOCK=1/1400;
  (function tick(t){
    const k=0.82+0.18*Math.sin(t*CLOCK*6.2)*Math.sin(t*CLOCK*11.3);
    flame.style.opacity=k.toFixed(3);
    flame.style.transform=`translate(-50%,-50%) scaleY(${(0.9+k*0.16).toFixed(3)})`;
    requestAnimationFrame(tick);
  })(0);
}

/* grain */
const g=document.getElementById('grain'); function grain(){
  g.width=innerWidth; g.height=innerHeight;
  const c=g.getContext('2d'), im=c.createImageData(g.width,g.height);
  for(let i=0;i<im.data.length;i+=4){const v=190+Math.random()*66;
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=28;}
  c.putImageData(im,0,0);} grain(); addEventListener('resize',grain);
</script>
</body>
</html>
